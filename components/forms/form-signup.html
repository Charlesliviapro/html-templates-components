<!-- Sign Up Form -->
<div class="form-container">
    <h2 style="text-align: center; margin-bottom: 2rem; color: var(--dark-color);">Create Account</h2>
    <form>
        <div class="form-group">
            <label for="signup-name" class="form-label">Full Name</label>
            <input type="text" id="signup-name" name="name" class="form-control" placeholder="John Doe" required>
        </div>
        
        <div class="form-group">
            <label for="signup-email" class="form-label">Email Address</label>
            <input type="email" id="signup-email" name="email" class="form-control" placeholder="your@email.com" required>
            <span class="form-text">We'll never share your email with anyone else.</span>
        </div>
        
        <div class="form-group">
            <label for="signup-password" class="form-label">Password</label>
            <input type="password" id="signup-password" name="password" class="form-control" placeholder="••••••••" required>
            <span class="form-text">Must be at least 8 characters long.</span>
        </div>
        
        <div class="form-group">
            <label for="signup-confirm" class="form-label">Confirm Password</label>
            <input type="password" id="signup-confirm" name="confirm" class="form-control" placeholder="••••••••" required>
        </div>
        
        <div class="form-group">
            <div class="form-checkbox">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the Terms and Conditions</label>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        
        <p style="text-align: center; margin-top: 1rem; color: var(--text-color);">
            Already have an account? <a href="#login" style="color: var(--primary-color);">Sign in</a>
        </p>
    </form>
</div>
