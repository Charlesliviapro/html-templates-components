<!-- Newsletter Subscription Form -->
<div class="form-container">
    <h2 style="text-align: center; margin-bottom: 1rem; color: var(--dark-color);">Subscribe to Our Newsletter</h2>
    <p style="text-align: center; margin-bottom: 2rem; color: var(--text-color);">Get the latest updates and news delivered to your inbox.</p>
    <form>
        <div class="form-group">
            <label for="newsletter-email" class="form-label">Email Address</label>
            <input type="email" id="newsletter-email" name="email" class="form-control" placeholder="your@email.com" required>
        </div>
        
        <div class="form-group">
            <div class="form-checkbox">
                <input type="checkbox" id="newsletter-consent" name="consent" required>
                <label for="newsletter-consent">I agree to receive marketing emails</label>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Subscribe</button>
    </form>
</div>
