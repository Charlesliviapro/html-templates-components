<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Form Component</title>
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body style="background-color: #f8f9fa; padding: 4rem 0;">
    <div class="container">
        <h1 style="text-align: center; margin-bottom: 2rem;">Search Form</h1>
        <p style="text-align: center; margin-bottom: 2rem;">A simple search form component for your website.</p>
        
        <!-- Search Form -->
        <form class="search-form">
            <input type="search" class="form-control" placeholder="Search..." aria-label="Search">
            <button type="submit" class="btn btn-primary">Search</button>
        </form>
    </div>
</body>
</html>
