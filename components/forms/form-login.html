<!-- Login Form -->
<div class="form-container">
    <h2 style="text-align: center; margin-bottom: 2rem; color: var(--dark-color);">Login</h2>
    <form>
        <div class="form-group">
            <label for="login-email" class="form-label">Email Address</label>
            <input type="email" id="login-email" name="email" class="form-control" placeholder="your@email.com" required>
        </div>
        
        <div class="form-group">
            <label for="login-password" class="form-label">Password</label>
            <input type="password" id="login-password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        
        <div class="form-group">
            <div class="form-checkbox">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember me</label>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        
        <p style="text-align: center; margin-top: 1rem;">
            <a href="#forgot" style="color: var(--primary-color);">Forgot password?</a>
        </p>
        
        <p style="text-align: center; margin-top: 1rem; color: var(--text-color);">
            Don't have an account? <a href="#signup" style="color: var(--primary-color);">Sign up</a>
        </p>
    </form>
</div>
