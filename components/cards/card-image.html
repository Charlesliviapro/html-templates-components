<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Card Component</title>
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body>
    <div class="container" style="padding: 2rem 0;">
        <h1>Image Card Component</h1>
        <p>Card with an image, title, and description.</p>

        <!-- Image Card -->
        <div class="card" style="max-width: 400px; margin: 2rem 0;">
            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800" alt="Card image" class="card-image">
            <div class="card-content">
                <h2 class="card-title">Technology</h2>
                <p class="card-text">
                    Discover the latest in technology trends and innovations. 
                    Stay updated with cutting-edge developments in the tech world.
                </p>
            </div>
            <div class="card-footer">
                <a href="#" class="btn btn-primary">Read More</a>
            </div>
        </div>
    </div>
</body>
</html>
