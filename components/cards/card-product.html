<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card Component</title>
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body>
    <div class="container" style="padding: 2rem 0;">
        <h1>Product Card Component</h1>
        <p>Card designed for e-commerce products with image, name, and price.</p>

        <!-- Product Card -->
        <div class="card card-product" style="max-width: 350px; margin: 2rem 0;">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800" alt="Product image" class="card-image">
            <div class="card-content">
                <h2 class="card-title">Premium Headphones</h2>
                <p class="card-text">High-quality wireless headphones with noise cancellation.</p>
                <div class="card-price">$299.99</div>
            </div>
            <div class="card-footer">
                <a href="#" class="btn btn-primary">Add to Cart</a>
            </div>
        </div>
    </div>
</body>
</html>
