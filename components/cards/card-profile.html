<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Component</title>
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body>
    <div class="container" style="padding: 2rem 0;">
        <h1>Profile Card Component</h1>
        <p>Card for displaying user profiles or team members.</p>

        <!-- Profile Card -->
        <div class="card card-profile" style="max-width: 350px; margin: 2rem 0;">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400" alt="Profile" class="card-image">
            <div class="card-content">
                <h2 class="card-title">Jane Doe</h2>
                <p class="card-text">
                    Senior Software Engineer<br>
                    Passionate about creating beautiful and functional web experiences.
                </p>
            </div>
            <div class="card-footer">
                <a href="#" class="btn btn-outline">View Profile</a>
            </div>
        </div>
    </div>
</body>
</html>
