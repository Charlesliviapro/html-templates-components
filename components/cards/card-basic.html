<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Card Component</title>
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body>
    <div class="container" style="padding: 2rem 0;">
        <h1>Basic Card Component</h1>
        <p>Simple card with title, text, and footer.</p>

        <!-- Basic Card -->
        <div class="card" style="max-width: 400px; margin: 2rem 0;">
            <div class="card-content">
                <h2 class="card-title">Card Title</h2>
                <p class="card-text">
                    This is a basic card component with a title and some descriptive text. 
                    Cards are great for displaying content in a structured, visually appealing way.
                </p>
            </div>
            <div class="card-footer">
                <a href="#" class="btn btn-primary">Learn More</a>
            </div>
        </div>
    </div>
</body>
</html>
