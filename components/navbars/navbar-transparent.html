<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparent Navbar Component</title>
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body>
    <!-- Transparent Navbar (for use over hero images) -->
    <nav class="navbar navbar-transparent">
        <div class="navbar-container">
            <a href="#" class="navbar-brand">BrandName</a>
            <ul class="navbar-menu">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Demo Hero Section to show transparent navbar -->
    <div class="hero hero-image" style="background-image: url('https://images.unsplash.com/photo-1557683316-973673baf926?w=1200'); min-height: 100vh;">
        <div class="hero-content">
            <h1>Transparent Navbar</h1>
            <p>This navbar has a transparent background, perfect for overlaying on hero images or full-screen backgrounds.</p>
        </div>
    </div>
</body>
</html>
